<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Image Fix</title>
    <style>
        :root { --bg: #000; --text: #fff; --blue: #38bdf8; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        main { flex: 1; padding: 20px; overflow-y: auto; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        .msg { margin: 10px 0; padding: 15px; border-radius: 20px; max-width: 85%; }
        .user { background: var(--blue); color: #000; align-self: flex-end; }
        .ai { background: #181818; align-self: flex-start; border: 1px solid #222; }
        .ai img { width: 100%; border-radius: 12px; margin-top: 10px; background: #111; min-height: 200px; }
        .footer { padding: 20px; display: flex; justify-content: center; }
        .input-bar { background: #181818; width: 100%; max-width: 600px; border-radius: 30px; padding: 5px 15px; display: flex; border: 1px solid #333; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; }
        button { background: var(--blue); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
        .loader { font-size: 12px; color: var(--blue); margin-bottom: 5px; }
    </style>
</head>
<body>

<main id="chat">
    <div class="ai msg">Hallo Patrick! Ich habe die Bild-KI repariert. Probier mal: "Ein Tiger im Weltraum".</div>
</main>

<div class="footer">
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Bild-Prompt eingeben..." autocomplete="off">
        <button onclick="generate()">↑</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');

    async function generate() {
        const prompt = input.value.trim();
        if (!prompt) return;

        addBubble(prompt, 'user');
        const aiBubble = addBubble('<div class="loader">Generiere Bild (Versuch 1)...</div>', 'ai');
        input.value = '';

        // ZUFALLS-SEED (WICHTIG gegen das "Wald-Bild-Problem")
        const seed = Math.floor(Math.random() * 1000000);
        
        // VERSCHIEDENE QUELLEN
        const source1 = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&model=flux&nologo=true`;
        const source2 = `https://api.hercai.onrender.com/v3/text2image?prompt=${encodeURIComponent(prompt)}`; // Backup Quelle

        const img = document.createElement('img');
        img.src = source1;

        img.onload = () => {
            aiBubble.innerHTML = `Hier ist dein Bild:<br>`;
            aiBubble.appendChild(img);
        };

        img.onerror = () => {
            // FALLBACK: Wenn Quelle 1 down ist, versuche Quelle 2
            aiBubble.innerHTML = `<div class="loader">Quelle 1 down, versuche Backup...</div>`;
            const backupImg = document.createElement('img');
            backupImg.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed + 1}&model=turbo`;
            
            backupImg.onload = () => {
                aiBubble.innerHTML = `Backup-Bild geladen:<br>`;
                aiBubble.appendChild(backupImg);
            };
            
            backupImg.onerror = () => {
                aiBubble.innerText = "Patrick, heute sind alle Bild-Server überlastet. 😭";
            };
        };

        chat.scrollTo(0, chat.scrollHeight);
    }

    function addBubble(t, c) {
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerHTML = t;
        chat.appendChild(d);
        chat.scrollTo(0, chat.scrollHeight);
        return d;
    }

    input.addEventListener("keypress", (e) => { if (e.key === "Enter") generate(); });
</script>
</body>
</html>
