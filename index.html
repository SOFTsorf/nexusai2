<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Nexus - Patrick Edition</title>
    <style>
        :root { --bg: #000; --text: #fff; --sub: #a0a0a0; --blue: #38bdf8; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 15px; display: flex; justify-content: center; border-bottom: 1px solid #1a1a1a; }
        .status-pill { background: #1a1a1a; color: #4caf50; padding: 5px 15px; border-radius: 20px; font-size: 11px; border: 1px solid #333; }
        main { flex: 1; padding: 20px; overflow-y: auto; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        .welcome h1 { font-size: 32px; font-weight: 500; margin-bottom: 5px; }
        .welcome p { font-size: 32px; color: var(--sub); margin: 0; font-weight: 500; }
        .pill-list { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
        .pill { background: #1c1c1c; border: none; color: white; padding: 12px 20px; border-radius: 25px; text-align: left; cursor: pointer; width: fit-content; }
        .msg { margin: 10px 0; padding: 14px 18px; border-radius: 20px; max-width: 85%; line-height: 1.5; }
        .user { background: var(--blue); color: #000; align-self: flex-end; font-weight: 500; }
        .ai { background: #181818; align-self: flex-start; border: 1px solid #222; }
        .ai img { width: 100%; border-radius: 12px; margin-top: 10px; }
        .footer { padding: 20px; display: flex; justify-content: center; }
        .input-bar { background: #181818; width: 100%; max-width: 600px; border-radius: 30px; padding: 5px 15px; display: flex; align-items: center; border: 1px solid #222; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; font-size: 16px; outline: none; }
        .send-btn { background: var(--blue); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .error { color: #ff6b6b; border-color: #552222 !important; }
    </style>
</head>
<body>

<header><div class="status-pill">System: Stabil (Multi-Cloud)</div></header>

<main id="chat">
    <div id="intro" class="welcome">
        <h1>Hallo Patrick</h1>
        <p>Womit fangen wir an?</p>
        <div class="pill-list">
            <button class="pill" onclick="quick('Zeichne ein cooles futuristisches Auto')">🎨 Bild generieren</button>
            <button class="pill" onclick="quick('Erzähl mir einen Witz')">😂 Witz erzählen</button>
            <button class="pill" onclick="quick('Hilf mir beim Programmieren')">💻 Code Hilfe</button>
        </div>
    </div>
</main>

<div class="footer">
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Schreib mir was..." autocomplete="off">
        <button class="send-btn" id="sendBtn">↑</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const intro = document.getElementById('intro');

    async function handle(text) {
        if (!text) return;
        if (intro) intro.remove();
        addBubble(text, 'user');
        const ai = addBubble('Suche beste KI...', 'ai');
        input.value = '';

        const isImage = /bild|zeichne|generiere|foto/i.test(text);

        if (isImage) {
            // Backup-System für Bilder
            const seed = Math.floor(Math.random() * 1000000);
            const providers = [
                `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?seed=${seed}&nologo=true`,
                `https://api.dicebear.com/7.x/identicon/svg?seed=${seed}` // Notfall-Platzhalter
            ];
            ai.innerHTML = `Einen Moment...<br><img src="${providers[0]}" onerror="this.src='${providers[1]}'">`;
        } else {
            // Backup-System für Text (Wechselt bei Fehler)
            try {
                let response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=mistral`);
                if (!response.ok) throw new Error();
                ai.innerText = await response.text();
            } catch {
                try {
                    // Zweiter Versuch mit anderem Modell
                    let response2 = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai`);
                    ai.innerText = await response2.text();
                } catch {
                    ai.innerText = "Patrick, alle freien Systeme sind gerade überlastet. Probier es in 10 Sekunden nochmal!";
                    ai.classList.add('error');
                }
            }
        }
        chat.scrollTo(0, chat.scrollHeight);
    }

    function addBubble(t, c) {
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerText = t;
        chat.appendChild(d, chat.firstChild);
        chat.scrollTo(0, chat.scrollHeight);
        return d;
    }

    function quick(q) { input.value = q; handle(q); }
    document.getElementById('sendBtn').onclick = () => handle(input.value);
    input.onkeypress = (e) => { if(e.key === 'Enter') handle(input.value); };
</script>
</body>
</html>
