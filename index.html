<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Fixed</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; }
        h2 { color: #38bdf8; }
        textarea { width: 100%; height: 120px; background: #334155; border: 1px solid #475569; border-radius: 12px; color: white; padding: 15px; font-size: 16px; resize: none; box-sizing: border-box; }
        button { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 15px; margin-top: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        #output { margin-top: 25px; padding: 15px; background: #0f172a; border-radius: 10px; border-left: 4px solid #38bdf8; text-align: left; min-height: 50px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>Nexus Gemini Fixed</h2>
    <textarea id="userInput" placeholder="Schreib etwas..."></textarea>
    <button id="sendBtn">Anfrage senden</button>
    <div id="output">Bereit.</div>
</div>

<script>
    const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
    // Wir nutzen hier das absolut stabile Modell über die V1 API
    const API_URL = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    const btn = document.getElementById('sendBtn');
    const input = document.getElementById('userInput');
    const output = document.getElementById('output');

    btn.onclick = async () => {
        const text = input.value.trim();
        if (!text) return;

        btn.disabled = true;
        output.innerText = "KI antwortet...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                output.innerText = "Fehler vom Server: " + data.error.message;
            } else {
                output.innerText = data.candidates[0].content.parts[0].text;
            }
        } catch (err) {
            output.innerText = "Netzwerkfehler: " + err.message;
        } finally {
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
