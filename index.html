<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Streaming Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: white;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5); /* Macht den Player auf dunklem Grund sichtbar */
        }
        .info {
            font-size: 0.9em;
            color: #bbb;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="info">Google Drive Audio Stream</div>
        <h2 id="title">Mein Track</h2>
        
        <audio controls id="myAudio">
            <source src="https://drive.google.com/uc?export=download&id=1yFGJStEA7zkhFGceS4pprWwuPudz5d8P" type="audio/mpeg">
            Dein Browser unterstützt das Audio-Element nicht.
        </audio>

        <p id="status" style="color: #ff4444; font-size: 0.8em; margin-top: 10px; display: none;">
            Fehler: Datei konnte nicht geladen werden. Prüfe die Freigabe!
        </p>
    </div>

    <script>
        const audio = document.getElementById('myAudio');
        const status = document.getElementById('status');

        // Check if there is an error loading the file
        audio.addEventListener('error', function() {
            status.style.display = 'block';
        });
    </script>

</body>
</html>
