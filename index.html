<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gemini</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --sub-text: #b0b0b0;
            --blue: #38bdf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Bar */
        header {
            display: flex;
            justify-content: center;
            padding: 15px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        #modelSelect {
            background: #222;
            color: white;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Chat Bereich */
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .welcome-section { margin-top: 40px; }
        .welcome-section h1 { font-size: 32px; font-weight: 500; margin-bottom: 5px; }
        .welcome-section p { font-size: 32px; color: var(--sub-text); margin-top: 0; font-weight: 500; }

        /* Pill Buttons */
        .pill-list { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
        .pill {
            background: #1e1e1e;
            border: none;
            color: white;
            padding: 14px 20px;
            border-radius: 25px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            width: fit-content;
            transition: background 0.2s;
        }
        .pill:hover { background: #333; }

        /* Sprechblasen */
        .msg { margin: 10px 0; padding: 14px 18px; border-radius: 20px; line-height: 1.5; max-width: 85%; word-wrap: break-word; }
        .user-msg { background: var(--blue); color: black; align-self: flex-end; font-weight: 500; }
        .ai-msg { background: #1e1e1e; align-self: flex-start; border: 1px solid #333; }

        /* Eingabebereich */
        .input-area { padding: 20px; display: flex; justify-content: center; background: var(--bg); }
        .input-box {
            background: #1e1e1e;
            width: 100%;
            max-width: 600px;
            border-radius: 30px;
            padding: 6px 15px;
            display: flex;
            align-items: center;
            border: 1px solid #333;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }
        .send-btn {
            background: var(--blue);
            color: black;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-box { background: #2a1111; border: 1px solid #441111; color: #ff6b6b; padding: 15px; border-radius: 15px; margin: 10px 0; }
    </style>
</head>
<body>

<header>
    <select id="modelSelect">
        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        <option value="gemini-2.0-flash-lite-preview-02-05">Gemini 2.0 Lite</option>
    </select>
</header>

<main id="chat">
    <div id="welcome" class="welcome-section">
        <h1>Hallo Patrick</h1>
        <p>Womit fangen wir an?</p>
        
        <div class="pill-list">
            <button class="pill" onclick="quickAction('Bild erstellen')">🎨 Bild erstellen</button>
            <button class="pill" onclick="quickAction('Hilf mir beim Lernen')">📚 Hilf mir beim Lernen</button>
            <button class="pill" onclick="quickAction('Hilf mir, effizienter zu sein')">✨ Hilf mir, effizienter zu sein</button>
            <button class="pill" onclick="quickAction('Etwas schreiben')">📄 Etwas schreiben</button>
        </div>
    </div>
</main>

<div class="input-area">
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Gemini fragen..." autocomplete="off">
        <button class="send-btn" id="sendBtn">↑</button>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
    const chatDisplay = document.getElementById('chat');
    const inputField = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcome = document.getElementById('welcome');
    const modelSelect = document.getElementById('modelSelect');

    async function startChat(text) {
        if (!text) return;
        
        if (welcome) welcome.remove();
        addMessage(text, 'user-msg');
        const aiBubble = addMessage('KI schreibt...', 'ai-msg');
        inputField.value = '';

        try {
            const modelName = modelSelect.value;
            // Wir nutzen hier v1beta, da die neuesten Modelle (2.0) oft nur dort liegen
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            
            if (data.error) {
                aiBubble.innerHTML = `<div class="error-box"><b>Fehler:</b> ${data.error.message}<br><br><small>Hinweis: In der EU sind manche Modelle für die API noch eingeschränkt. Probiere 'Gemini 1.5 Flash'.</small></div>`;
            } else {
                aiBubble.innerText = data.candidates[0].content.parts[0].text;
            }
        } catch (e) {
            aiBubble.innerText = "Netzwerkfehler: " + e.message;
        } finally {
            chatDisplay.scrollTo(0, chatDisplay.scrollHeight);
        }
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatDisplay.appendChild(div);
        chatDisplay.scrollTo(0, chatDisplay.scrollHeight);
        return div;
    }

    function quickAction(cmd) {
        inputField.value = cmd;
        startChat(cmd);
    }

    sendBtn.onclick = () => startChat(inputField.value);
    inputField.onkeypress = (e) => { if(e.key === 'Enter') startChat(inputField.value); };
</script>

</body>
</html>
