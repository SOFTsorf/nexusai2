<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Gemini 2026</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 500px; }
        h2 { color: #38bdf8; margin-bottom: 20px; text-align: center; }
        textarea { width: 100%; height: 120px; background: #334155; border: 1px solid #475569; border-radius: 12px; color: white; padding: 15px; font-size: 16px; resize: none; box-sizing: border-box; }
        button { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 15px; margin-top: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #7dd3fc; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        #output { margin-top: 25px; padding: 15px; background: #0f172a; border-radius: 10px; border-left: 4px solid #38bdf8; min-height: 50px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>Nexus Gemini 3</h2>
    <textarea id="userInput" placeholder="Was möchtest du wissen?"></textarea>
    <button id="sendBtn">KI anfragen</button>
    <div id="output">Warte auf Eingabe...</div>
</div>

<script type="module">
    // Wir importieren die Version 0.12.0 - das ist die stabilste Version für Browser
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai@0.12.0";

    // Dein Key
    const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
    const genAI = new GoogleGenerativeAI(API_KEY);

    // WICHTIG: Wir nutzen hier gemini-1.5-flash. 
    // Gemini-3-flash-preview ist zum jetzigen Zeitpunkt oft auf Python-Umgebungen beschränkt.
    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

    const btn = document.getElementById('sendBtn');
    const input = document.getElementById('userInput');
    const output = document.getElementById('output');

    btn.onclick = async () => {
        const text = input.value.trim();
        if (!text) return;

        btn.disabled = true;
        btn.innerText = "Verbindung zu Google...";
        output.innerText = "Gemini denkt nach...";

        try {
            // Wir nutzen die exakte Methode aus deinem Quickstart
            const result = await model.generateContent(text);
            const response = await result.response;
            output.innerText = response.text();
        } catch (err) {
            console.error("Fehler Details:", err);
            output.innerHTML = `<span style="color:#f87171">Fehler:</span> ${err.message}<br><br>
            <small>Tipp: Falls '404' erscheint, ist das Modell 'gemini-3' evtl. noch nicht für Web-API Keys in deiner Region frei. Nutze dann 'gemini-1.5-flash'.</small>`;
        } finally {
            btn.disabled = false;
            btn.innerText = "KI anfragen";
        }
    };
</script>

</body>
</html>
