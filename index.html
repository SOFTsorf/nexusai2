<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Gemini</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border: 1px solid #ddd; }
        h2 { color: #007bff; margin-bottom: 15px; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 12px; margin-top: 10px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #999; }
        #output { margin-top: 20px; padding: 15px; background: #eee; border-radius: 8px; white-space: pre-wrap; font-size: 15px; min-height: 40px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Nexus AI Chat</h2>
    <textarea id="txtInput" placeholder="Frag mich etwas..."></textarea>
    <button id="btnSend">Abschicken</button>
    <div id="output">Bereit für deine Anfrage.</div>
</div>

<script type="module">
    // Wir nutzen eine spezifische Version des SDKs
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai@0.1.0";

    const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
    const genAI = new GoogleGenerativeAI(API_KEY);

    // Wir probieren hier das Basis 'gemini-pro' Modell, 
    // da Flash manchmal regionale Beschränkungen in der v1beta hat
    const model = genAI.getGenerativeModel({ model: "gemini-pro" });

    const btn = document.getElementById('btnSend');
    const input = document.getElementById('txtInput');
    const output = document.getElementById('output');

    btn.onclick = async () => {
        const prompt = input.value.trim();
        if (!prompt) return;

        btn.disabled = true;
        btn.innerText = "Verarbeite...";
        output.innerText = "KI denkt nach...";

        try {
            const result = await model.generateContent(prompt);
            const response = await result.response;
            output.innerText = response.text();
        } catch (err) {
            console.error(err);
            // Spezielle Hilfe bei 404
            if (err.message.includes("404")) {
                output.innerHTML = "<b style='color:red'>Fehler 404:</b> Modell nicht gefunden. Probiere in AI Studio den Key für 'Gemini Pro' zu aktivieren oder warte 5 Minuten, bis der Key global aktiv ist.";
            } else {
                output.innerText = "Fehler: " + err.message;
            }
        } finally {
            btn.disabled = false;
            btn.innerText = "Abschicken";
        }
    };
</script>

</body>
</html>
