<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini - Nexus AI</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --sub-text: #b0b0b0;
            --accent: #3e3e3e;
            --blue: #38bdf8;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            display: flex;
            justify-content: center;
            padding: 15px;
            border-bottom: 1px solid #111;
        }

        #modelSelect {
            background: #222;
            color: white;
            border: 1px solid #333;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-area h1 { font-size: 28px; margin-bottom: 5px; font-weight: 500; }
        .welcome-area p { font-size: 28px; color: var(--sub-text); margin-top: 0; }

        /* Pill Buttons */
        .pill-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .pill {
            background: var(--card-bg);
            border: none;
            color: var(--text);
            padding: 12px 20px;
            border-radius: 25px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            width: fit-content;
            transition: background 0.2s;
        }

        .pill:hover { background: var(--accent); }

        /* Chat bubbles */
        .msg { margin: 10px 0; padding: 12px 16px; border-radius: 18px; line-height: 1.5; max-width: 85%; }
        .user-msg { background: #38bdf8; color: black; align-self: flex-end; }
        .ai-msg { background: #222; align-self: flex-start; border: 1px solid #333; }

        /* Input Area */
        .input-container {
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .input-box {
            background: #1e1e1e;
            width: 100%;
            max-width: 600px;
            border-radius: 30px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            border: 1px solid #333;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        .send-btn {
            background: var(--blue);
            color: black;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .error { color: #ff6b6b; font-size: 14px; background: #2a1111; border: 1px solid #441111; }
    </style>
</head>
<body>

<header>
    <select id="modelSelect">
        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash</option>
    </select>
</header>

<main id="chat">
    <div id="welcome" class="welcome-area">
        <h1>Hallo Patrick</h1>
        <p>Womit fangen wir an?</p>
        
        <div class="pill-container">
            <button class="pill" onclick="quickAsk('Bild erstellen')">🎨 Bild erstellen</button>
            <button class="pill" onclick="quickAsk('Hilf mir beim Lernen')">📚 Hilf mir beim Lernen</button>
            <button class="pill" onclick="quickAsk('Hilf mir, effizienter zu sein')">✨ Hilf mir, effizienter zu sein</button>
            <button class="pill" onclick="quickAsk('Etwas schreiben')">📄 Etwas schreiben</button>
        </div>
    </div>
</main>

<div class="input-container">
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Gemini fragen..." autocomplete="off">
        <button class="send-btn" id="sendBtn">↑</button>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const welcome = document.getElementById('welcome');
    const modelSelect = document.getElementById('modelSelect');

    async function askAI(text) {
        if (!text) return;
        
        // UI aufräumen
        if (welcome) welcome.remove();
        addMsg(text, 'user-msg');
        const aiMsg = addMsg('...', 'ai-msg');
        input.value = '';

        try {
            const model = modelSelect.value;
            // WICHTIG: Wir nutzen v1 statt v1beta für maximale Stabilität
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            
            aiMsg.innerText = data.candidates[0].content.parts[0].text;
        } catch (e) {
            aiMsg.classList.add('error');
            aiMsg.innerText = "Fehler: " + e.message;
        } finally {
            chat.scrollTo(0, chat.scrollHeight);
        }
    }

    function addMsg(text, type) {
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerText = text;
        chat.appendChild(d);
        chat.scrollTo(0, chat.scrollHeight);
        return d;
    }

    function quickAsk(q) {
        input.value = q;
        askAI(q);
    }

    btn.onclick = () => askAI(input.value);
    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(input.value); };
</script>

</body>
</html>
