<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Gemini Modell-Check</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; }
        .model-item { background: #334155; margin: 5px 0; padding: 10px; border-radius: 5px; font-family: monospace; }
        button { width: 100%; padding: 10px; cursor: pointer; background: #38bdf8; border: none; border-radius: 5px; font-weight: bold; }
        #log { margin-top: 20px; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Verfügbare Modelle prüfen</h2>
        <button id="checkBtn">Modelle auflisten</button>
        <div id="results"></div>
        <div id="log"></div>
    </div>

    <script>
        const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
        
        document.getElementById('checkBtn').onclick = async () => {
            const resultsDiv = document.getElementById('results');
            const logDiv = document.getElementById('log');
            resultsDiv.innerHTML = "Suche...";
            
            try {
                // Wir fragen die Liste der Modelle ab
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${API_KEY}`);
                const data = await response.json();
                
                if (data.models) {
                    resultsDiv.innerHTML = "<h3>Deine verfügbaren Modelle:</h3>";
                    data.models.forEach(m => {
                        const div = document.createElement('div');
                        div.className = 'model-item';
                        // Wir filtern nach Modellen, die 'generateContent' unterstützen
                        if(m.supportedGenerationMethods.includes('generateContent')) {
                            div.innerHTML = `<strong>${m.name.replace('models/', '')}</strong>`;
                            resultsDiv.appendChild(div);
                        }
                    });
                    logDiv.innerText = "Kopiere einen dieser Namen oben exakt in deinen Chat-Code.";
                } else {
                    resultsDiv.innerText = "Keine Modelle gefunden. Fehler: " + JSON.stringify(data.error);
                }
            } catch (err) {
                resultsDiv.innerText = "Fehler beim Abrufen: " + err.message;
            }
        };
    </script>
</body>
</html>
