<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Nexus AI</title>
    <style>
        :root {
            --bg: #000;
            --card: #121212;
            --text: #ffffff;
            --sub: #a0a0a0;
            --blue: #38bdf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .status-pill {
            background: #1a1a1a;
            color: var(--sub);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #333;
        }

        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .welcome-area { margin-top: 60px; }
        .welcome-area h1 { font-size: 34px; font-weight: 500; margin-bottom: 0; }
        .welcome-area p { font-size: 34px; color: var(--sub); margin-top: 5px; font-weight: 500; }

        .pill-list { display: flex; flex-direction: column; gap: 12px; margin-top: 35px; }
        .pill {
            background: #1c1c1c;
            border: none;
            color: white;
            padding: 14px 22px;
            border-radius: 25px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            width: fit-content;
            transition: 0.2s;
        }
        .pill:hover { background: #2a2a2a; }

        .msg { margin: 12px 0; padding: 14px 20px; border-radius: 22px; line-height: 1.6; max-width: 85%; font-size: 16px; }
        .user-msg { background: var(--blue); color: #000; align-self: flex-end; font-weight: 500; }
        .ai-msg { background: #181818; align-self: flex-start; border: 1px solid #222; }

        .input-section { padding: 25px; display: flex; justify-content: center; background: var(--bg); }
        .input-bar {
            background: #181818;
            width: 100%;
            max-width: 600px;
            border-radius: 35px;
            padding: 6px 18px;
            display: flex;
            align-items: center;
            border: 1px solid #222;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        .send-btn {
            background: var(--blue);
            color: black;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .err-msg { background: #2d1414; color: #ff8080; border: 1px solid #4a1a1a; }
    </style>
</head>
<body>

<header>
    <div class="status-pill">Gemini 1.5 Flash</div>
</header>

<main id="chatWindow">
    <div id="startScreen" class="welcome-area">
        <h1>Hallo Patrick</h1>
        <p>Womit fangen wir an?</p>
        
        <div class="pill-list">
            <button class="pill" onclick="quickAsk('Bild erstellen')">🎨 Bild erstellen</button>
            <button class="pill" onclick="quickAsk('Hilf mir beim Lernen')">📚 Hilf mir beim Lernen</button>
            <button class="pill" onclick="quickAsk('Etwas schreiben')">📄 Etwas schreiben</button>
        </div>
    </div>
</main>

<div class="input-section">
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Gemini fragen..." autocomplete="off">
        <button class="send-btn" id="sendBtn">↑</button>
    </div>
</div>

<script>
    // DEIN KEY (Falls dieser weiterhin 'Limit 0' liefert, ist das Projekt gesperrt)
    const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
    const MODEL = "gemini-1.5-flash";

    const chat = document.getElementById('chatWindow');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const start = document.getElementById('startScreen');

    async function callGemini(text) {
        if (!text) return;
        
        if (start) start.remove();
        addBubble(text, 'user-msg');
        const aiBubble = addBubble('...', 'ai-msg');
        input.value = '';

        try {
            // Wir nutzen die v1 Schnittstelle, da diese oft bessere Quotas hat als v1beta
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/${MODEL}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            
            if (data.error) {
                aiBubble.classList.add('err-msg');
                if (data.error.message.includes('quota')) {
                    aiBubble.innerText = "Quota-Fehler: Dein Projekt-Limit liegt bei 0. Bitte lösche alte Projekte in der Google Cloud Console, um Platz für ein neues, frisches Projekt zu machen.";
                } else {
                    aiBubble.innerText = "Fehler: " + data.error.message;
                }
            } else {
                aiBubble.innerText = data.candidates[0].content.parts[0].text;
            }
        } catch (e) {
            aiBubble.innerText = "Netzwerkfehler. Bitte Internetverbindung prüfen.";
        }
        chat.scrollTo(0, chat.scrollHeight);
    }

    function addBubble(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTo(0, chat.scrollHeight);
        return div;
    }

    function quickAsk(q) { input.value = q; callGemini(q); }
    btn.onclick = () => callGemini(input.value);
    input.onkeypress = (e) => { if(e.key === 'Enter') callGemini(input.value); };
</script>

</body>
</html>
