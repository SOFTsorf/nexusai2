<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Ultimate - Fixed</title>
    <style>
        :root { --bg: #000; --text: #fff; --blue: #38bdf8; --sub: #a0a0a0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 15px; border-bottom: 1px solid #1a1a1a; text-align: center; }
        .status { background: #1a1a1a; color: #4caf50; padding: 5px 15px; border-radius: 20px; font-size: 11px; border: 1px solid #333; }
        main { flex: 1; padding: 20px; overflow-y: auto; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        .welcome h1 { font-size: 32px; font-weight: 500; margin-bottom: 5px; }
        .welcome p { font-size: 32px; color: var(--sub); margin: 0; }
        .pill { background: #1c1c1c; border: none; color: white; padding: 12px 20px; border-radius: 25px; text-align: left; cursor: pointer; margin-top: 10px; width: fit-content; }
        .msg { margin: 10px 0; padding: 14px 18px; border-radius: 20px; max-width: 85%; line-height: 1.5; word-wrap: break-word; }
        .user { background: var(--blue); color: #000; align-self: flex-end; font-weight: 500; }
        .ai { background: #181818; align-self: flex-start; border: 1px solid #222; position: relative; }
        .ai img { width: 100%; border-radius: 12px; margin-top: 10px; display: block; background: #000; }
        .footer { padding: 20px; display: flex; justify-content: center; }
        .input-bar { background: #181818; width: 100%; max-width: 600px; border-radius: 30px; padding: 5px 15px; display: flex; border: 1px solid #222; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; font-size: 16px; outline: none; }
        .send-btn { background: var(--blue); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .loading { font-size: 12px; color: var(--blue); margin-bottom: 5px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

<header><span class="status">System: Stabil & Keyless</span></header>

<main id="chat">
    <div id="intro" class="welcome">
        <h1>Hallo Patrick</h1>
        <p>Diesmal klappt's!</p>
        <button class="pill" onclick="quick('Zeichne einen schnellen Sportwagen in der Nacht')">🎨 Bild generieren</button>
        <button class="pill" onclick="quick('Schreib einen kurzen Text über Mut')">✍️ Etwas schreiben</button>
    </div>
</main>

<div class="footer">
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Schreib mir was..." autocomplete="off">
        <button class="send-btn" onclick="handle()">↑</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const intro = document.getElementById('intro');

    async function handle() {
        const text = input.value.trim();
        if (!text) return;
        if (intro) intro.remove();
        
        addBubble(text, 'user');
        const ai = addBubble('<div class="loading">KI sucht stabilen Server...</div>', 'ai');
        input.value = '';

        const isImage = /bild|zeichne|generiere|foto/i.test(text);

        if (isImage) {
            // VERBESSERTE BILD-LOGIK (Verhindert 502 & Cache-Fehler)
            const seed = Math.floor(Math.random() * 999999);
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1080&height=1080&seed=${seed}&model=flux`;
            
            ai.innerHTML = `Hier ist dein Bild:<br><img src="${imgUrl}" onload="this.previousSibling.remove()" onerror="this.src='https://dummyimage.com/500/181818/fff&text=Server+belegt+:(+Nochmal+senden!'">`;
        } else {
            // MULTI-FETCH LOGIK FÜR TEXT
            try {
                // Versuch 1: Mistral
                let res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=mistral&system=Du+bist+eine+hilfreiche+KI+für+Patrick.`);
                if (!res.ok) throw new Error();
                ai.innerText = await res.text();
            } catch {
                try {
                    // Versuch 2: OpenAI (über freien Proxy)
                    let res2 = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai`);
                    ai.innerText = await res2.text();
                } catch {
                    ai.innerText = "Patrick, selbst die Backups sind gerade down. Das Internet scheint heute einen schlechten Tag zu haben. Probier es gleich nochmal!";
                }
            }
        }
        chat.scrollTo(0, chat.scrollHeight);
    }

    function addBubble(t, c) {
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerHTML = t;
        chat.appendChild(d);
        chat.scrollTo(0, chat.scrollHeight);
        return d;
    }

    function quick(q) { input.value = q; handle(); }
    input.addEventListener("keypress", (e) => { if (e.key === "Enter") handle(); });
</script>
</body>
</html>
