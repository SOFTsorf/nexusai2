<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gemini Fixed</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #111111;
            --text: #ffffff;
            --sub-text: #b0b0b0;
            --blue: #38bdf8;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header { padding: 20px; text-align: center; border-bottom: 1px solid #222; }

        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome h1 { font-size: 32px; margin-bottom: 0; }
        .welcome p { font-size: 32px; color: var(--sub-text); margin-top: 5px; }

        .pill-box { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .pill {
            background: #1e1e1e;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            text-align: left;
            width: fit-content;
        }

        .msg { margin: 10px 0; padding: 12px 16px; border-radius: 18px; line-height: 1.5; max-width: 85%; }
        .user-msg { background: var(--blue); color: black; align-self: flex-end; }
        .ai-msg { background: #222; align-self: flex-start; border: 1px solid #333; }

        .input-area { padding: 20px; display: flex; justify-content: center; }
        .input-box {
            background: #1e1e1e;
            width: 100%;
            max-width: 600px;
            border-radius: 30px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            border: 1px solid #333;
        }

        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; }
        .send-btn { background: var(--blue); border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div style="color: #555; font-size: 12px;">Modell: gemini-2.0-flash</div>
</header>

<main id="chat">
    <div id="welcome" class="welcome">
        <h1>Hallo Patrick</h1>
        <p>Womit fangen wir an?</p>
        <div class="pill-box">
            <button class="pill" onclick="sendQuick('Bild erstellen')">🎨 Bild erstellen</button>
            <button class="pill" onclick="sendQuick('Hilf mir beim Lernen')">📚 Hilf mir beim Lernen</button>
        </div>
    </div>
</main>

<div class="input-area">
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Gemini fragen...">
        <button class="send-btn" id="sendBtn">↑</button>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
    
    // WICHTIG: Wir nutzen eines der Modelle, die in deinem Check als verfügbar angezeigt wurden!
    const MODEL_ID = "gemini-2.0-flash"; 

    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const welcome = document.getElementById('welcome');

    async function ask(text) {
        if (!text) return;
        if (welcome) welcome.remove();
        
        addMsg(text, 'user-msg');
        const aiBubble = addMsg('...', 'ai-msg');
        input.value = '';

        try {
            // Wir nutzen die stabile v1 URL
            const url = `https://generativelanguage.googleapis.com/v1/models/${MODEL_ID}:generateContent?key=${API_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            
            if (data.error) {
                aiBubble.innerHTML = `<span style="color:red">Fehler: ${data.error.message}</span>`;
            } else {
                aiBubble.innerText = data.candidates[0].content.parts[0].text;
            }
        } catch (e) {
            aiBubble.innerText = "Fehler: " + e.message;
        }
    }

    function addMsg(t, cls) {
        const d = document.createElement('div');
        d.className = `msg ${cls}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTo(0, chat.scrollHeight);
        return d;
    }

    function sendQuick(t) { input.value = t; ask(t); }
    btn.onclick = () => ask(input.value);
    input.onkeypress = (e) => { if(e.key === 'Enter') ask(input.value); };
</script>

</body>
</html>
