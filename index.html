<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Gemini KI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 { color: #1a73e8; margin-top: 0; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #ccc; }
        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 4px solid #1a73e8;
            border-radius: 4px;
            min-height: 50px;
            color: #333;
            line-height: 1.5;
        }
        .loader { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="chat-card">
    <h2>Gemini KI-Chat</h2>
    <textarea id="promptInput" placeholder="Stelle mir eine Frage..."></textarea>
    <button id="submitBtn">Abschicken</button>
    <div id="output">Die Antwort erscheint hier...</div>
</div>

<script type="module">
    // Import des offiziellen Google AI SDK
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // DEIN API-KEY (bereits eingefügt)
    const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
    
    // Initialisierung
    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

    const btn = document.getElementById('submitBtn');
    const input = document.getElementById('promptInput');
    const output = document.getElementById('output');

    btn.addEventListener('click', async () => {
        const text = input.value.trim();
        if (!text) return;

        // UI-Status während des Ladens
        btn.disabled = true;
        btn.innerText = "Übermittle...";
        output.innerHTML = '<span class="loader">Gemini denkt nach...</span>';

        try {
            // Verbindung zur API herstellen
            const result = await model.generateContent(text);
            const response = await result.response;
            const responseText = response.text();

            // Ergebnis anzeigen
            output.innerText = responseText;
        } catch (error) {
            console.error(error);
            output.innerText = "Fehler: " + error.message;
        } finally {
            btn.disabled = false;
            btn.innerText = "Abschicken";
        }
    });
</script>

</body>
</html>
