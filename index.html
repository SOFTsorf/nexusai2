<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini KI - Nexus AI</title>
    <style>
        :root {
            --primary: #1a73e8;
            --bg: #f0f2f5;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .chat-card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
        }
        h2 { color: var(--primary); margin-top: 0; font-size: 1.5rem; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            resize: none;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            margin-top: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #output {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid var(--primary);
            border-radius: 8px;
            min-height: 50px;
            color: #333;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .error-msg { color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-card">
    <h2>Gemini KI-Chat</h2>
    <textarea id="promptInput" placeholder="Stelle eine Frage an die KI..."></textarea>
    <button id="submitBtn">Abschicken</button>
    <div id="output">Die Antwort erscheint hier...</div>
</div>

<script type="module">
    // Import des Google AI SDK
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // DEIN API-KEY
    const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
    
    // Initialisierung mit dem neuesten Flash-Modell
    const genAI = new GoogleGenerativeAI(API_KEY);
    
    // Fix: Wir nutzen 'gemini-1.5-flash-latest' für bessere Kompatibilität
    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash-latest" });

    const btn = document.getElementById('submitBtn');
    const input = document.getElementById('promptInput');
    const output = document.getElementById('output');

    btn.addEventListener('click', async () => {
        const text = input.value.trim();
        if (!text) return;

        // UI Updates
        btn.disabled = true;
        btn.innerText = "Verbindung wird aufgebaut...";
        output.innerHTML = '<em>Gemini schreibt...</em>';

        try {
            // API Aufruf
            const result = await model.generateContent(text);
            const response = await result.response;
            const responseText = response.text();

            // Ergebnis anzeigen
            output.innerText = responseText;
        } catch (error) {
            console.error("API Fehler:", error);
            output.innerHTML = `<span class="error-msg">Fehler:</span> ${error.message}`;
        } finally {
            btn.disabled = false;
            btn.innerText = "Abschicken";
        }
    });
</script>

</body>
</html>
