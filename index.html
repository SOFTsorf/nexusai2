<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Patrick Edition</title>
    <style>
        :root {
            --bg: #000;
            --card: #121212;
            --text: #ffffff;
            --sub: #a0a0a0;
            --blue: #38bdf8;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .status-pill {
            background: #1a1a1a;
            color: #4caf50;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #333;
        }

        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .welcome-area { margin-top: 60px; }
        .welcome-area h1 { font-size: 34px; font-weight: 500; margin-bottom: 5px; }
        .welcome-area p { font-size: 34px; color: var(--sub); margin-top: 0; font-weight: 500; }

        .pill-list { display: flex; flex-direction: column; gap: 12px; margin-top: 35px; }
        .pill {
            background: #1c1c1c;
            border: none;
            color: white;
            padding: 14px 22px;
            border-radius: 25px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            width: fit-content;
        }

        .msg { margin: 12px 0; padding: 14px 20px; border-radius: 22px; line-height: 1.6; max-width: 85%; }
        .user { background: var(--blue); color: #000; align-self: flex-end; font-weight: 500; }
        .ai { background: #181818; align-self: flex-start; border: 1px solid #222; }

        /* Bild-Style */
        .ai img { width: 100%; border-radius: 15px; margin-top: 10px; }

        .footer { padding: 25px; display: flex; justify-content: center; background: var(--bg); }
        .input-bar {
            background: #181818;
            width: 100%;
            max-width: 600px;
            border-radius: 35px;
            padding: 6px 18px;
            display: flex;
            align-items: center;
            border: 1px solid #222;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        .send-btn {
            background: var(--blue);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <div class="status-pill">Pollinations.ai (Free Mode)</div>
</header>

<main id="chat">
    <div id="intro" class="welcome-area">
        <h1>Hallo Patrick</h1>
        <p>Womit fangen wir an?</p>
        <div class="pill-list">
            <button class="pill" onclick="quick('Generiere ein Bild von einem Astronauten auf dem Mars')">🎨 Bild generieren</button>
            <button class="pill" onclick="quick('Schreibe ein Gedicht über Programmieren')">📚 Etwas schreiben</button>
            <button class="pill" onclick="quick('Was kannst du alles?')">✨ Fähigkeiten zeigen</button>
        </div>
    </div>
</main>

<div class="footer">
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Frage mich etwas..." autocomplete="off">
        <button class="send-btn" id="sendBtn">↑</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const intro = document.getElementById('intro');

    async function talk(text) {
        if (!text) return;
        if (intro) intro.remove();
        
        addBubble(text, 'user');
        const aiBubble = addBubble('Denke nach...', 'ai');
        input.value = '';

        // Prüfen, ob nach einem BILD gefragt wird
        if (text.toLowerCase().includes("bild") || text.toLowerCase().includes("generiere")) {
            const seed = Math.floor(Math.random() * 1000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1024&seed=${seed}&nologo=true`;
            aiBubble.innerHTML = `Hier ist dein Bild:<br><img src="${imageUrl}" alt="AI Image">`;
        } else {
            // Normale Text-Anfrage (Pollinations Text API)
            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai`);
                const data = await response.text();
                aiBubble.innerText = data;
            } catch (e) {
                aiBubble.innerText = "Hoppla, da gab es ein Problem mit der Verbindung.";
            }
        }
        chat.scrollTo(0, chat.scrollHeight);
    }

    function addBubble(t, c) {
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTo(0, chat.scrollHeight);
        return d;
    }

    function quick(q) { input.value = q; talk(q); }
    btn.onclick = () => talk(input.value);
    input.onkeypress = (e) => { if(e.key === 'Enter') talk(input.value); };
</script>

</body>
</html>
