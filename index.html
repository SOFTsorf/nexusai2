<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gemini Pro</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-sub: #b4b4b4;
            --accent: #38bdf8;
            --input-bg: #1e1e1e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header & Modell-Auswahl */
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        select {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 20px;
            outline: none;
            cursor: pointer;
            font-size: 14px;
        }

        /* Chat Bereich */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-msg {
            margin-top: 50px;
        }

        .welcome-msg h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .welcome-msg p {
            font-size: 24px;
            color: var(--text-sub);
        }

        .message {
            padding: 12px 18px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--accent);
            color: #000;
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--card-bg);
            border: 1px solid #222;
        }

        /* Eingabebereich unten */
        .input-area {
            padding: 20px;
            background: linear-gradient(transparent, var(--bg-color) 20%);
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            max-width: 700px;
            background: var(--input-bg);
            border-radius: 25px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            border: 1px solid #333;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            background: var(--accent);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover { transform: scale(1.1); }
        button:disabled { background: #555; cursor: not-allowed; }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <select id="modelSelector">
            <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash (Schnell)</option>
            <option value="gemini-2.0-flash-lite-preview-02-05">Gemini 2.0 Lite</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Schlau)</option>
            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        </select>
    </header>

    <main id="chat-container">
        <div class="welcome-msg" id="welcome">
            <h1>Hallo Patrick</h1>
            <p>Womit fangen wir an?</p>
        </div>
        </main>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Gemini fragen..." autocomplete="off">
            <button id="sendBtn">↑</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai@0.12.0";

        const API_KEY = "AIzaSyDbFvqgb2lOTzrN02zUq6vJ6Ik1GHk_nCw";
        const genAI = new GoogleGenerativeAI(API_KEY);

        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelector = document.getElementById('modelSelector');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI aufräumen
            if (welcomeScreen) welcomeScreen.style.display = 'none';
            userInput.value = '';
            
            // User Nachricht anzeigen
            addMessage(text, 'user-message');

            // AI Platzhalter
            const aiMsgDiv = addMessage('...', 'ai-message');
            
            try {
                // Ausgewähltes Modell nutzen
                const selectedModel = modelSelector.value;
                const model = genAI.getGenerativeModel({ model: selectedModel });
                
                sendBtn.disabled = true;
                const result = await model.generateContent(text);
                const response = await result.response;
                aiMsgDiv.innerText = response.text();
            } catch (error) {
                console.error(error);
                aiMsgDiv.innerHTML = `<span style="color:#ff6b6b">Fehler: ${error.message}</span>`;
            } finally {
                sendBtn.disabled = false;
                chatContainer.scrollTo(0, chatContainer.scrollHeight);
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTo(0, chatContainer.scrollHeight);
            return div;
        }

        sendBtn.onclick = sendMessage;
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
