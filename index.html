<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Testseite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .player-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            color: #333;
        }
        audio {
            margin-top: 15px;
            width: 300px;
        }
        .status {
            margin-top: 10px;
            font-size: 0.8em;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Mein Audio Player</h2>
        <p>Datei wird von Google Drive geladen...</p>
        
        <audio controls>
            <source src="https://docs.google.com/uc?export=open&id=1yFGJStEA7zkhFGceS4pprWwuPudz5d8P" type="audio/mpeg">
            Dein Browser unterstützt das Audio-Element nicht.
        </audio>

        <div class="status">
            Hinweis: Falls kein Ton kommt, prüfe die Freigabe der Datei in Google Drive.
        </div>
    </div>

</body>
</html>
