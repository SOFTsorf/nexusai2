<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multi-AI</title>
    <style>
        :root { --bg: #000; --card: #121212; --text: #ffffff; --sub: #a0a0a0; --blue: #38bdf8; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 15px; display: flex; justify-content: center; border-bottom: 1px solid #1a1a1a; }
        .status-pill { background: #1a1a1a; color: #4caf50; padding: 5px 15px; border-radius: 20px; font-size: 12px; border: 1px solid #333; }
        main { flex: 1; padding: 20px; overflow-y: auto; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        .welcome { margin-top: 60px; }
        .welcome h1 { font-size: 34px; font-weight: 500; margin-bottom: 5px; }
        .welcome p { font-size: 34px; color: var(--sub); margin: 0; font-weight: 500; }
        .pill-list { display: flex; flex-direction: column; gap: 12px; margin-top: 35px; }
        .pill { background: #1c1c1c; border: none; color: white; padding: 14px 22px; border-radius: 25px; text-align: left; font-size: 16px; cursor: pointer; width: fit-content; }
        .msg { margin: 12px 0; padding: 14px 20px; border-radius: 22px; line-height: 1.6; max-width: 85%; }
        .user { background: var(--blue); color: #000; align-self: flex-end; font-weight: 500; }
        .ai { background: #181818; align-self: flex-start; border: 1px solid #222; }
        .ai img { width: 100%; border-radius: 15px; margin-top: 10px; border: 1px solid #333; }
        .footer { padding: 25px; display: flex; justify-content: center; background: var(--bg); }
        .input-bar { background: #181818; width: 100%; max-width: 600px; border-radius: 35px; padding: 6px 18px; display: flex; align-items: center; border: 1px solid #222; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; font-size: 16px; outline: none; }
        .send-btn { background: var(--blue); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .loading { font-style: italic; color: var(--sub); font-size: 14px; }
    </style>
</head>
<body>

<header><div class="status-pill" id="status">Multi-AI Aktiv (Kein Key)</div></header>

<main id="chat">
    <div id="intro" class="welcome">
        <h1>Hallo Patrick</h1>
        <p>Womit fangen wir an?</p>
        <div class="pill-list">
            <button class="pill" onclick="quick('Ein Bild von einem Cyberpunk Auto')">🎨 Bild erstellen</button>
            <button class="pill" onclick="quick('Erkläre mir Quantenphysik kurz')">📚 Etwas lernen</button>
            <button class="pill" onclick="quick('Schreib eine kurze Sci-Fi Story')">📄 Etwas schreiben</button>
        </div>
    </div>
</main>

<div class="footer">
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Frag mich was..." autocomplete="off">
        <button class="send-btn" id="sendBtn">↑</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const intro = document.getElementById('intro');

    async function handleRequest(text) {
        if (!text) return;
        if (intro) intro.remove();
        
        addBubble(text, 'user');
        const aiBubble = addBubble('KI überlegt...', 'ai');
        aiBubble.classList.add('loading');
        input.value = '';

        // LOGIK: Bild oder Text?
        const isImageRequest = /bild|generiere|zeichne|foto/i.test(text);

        if (isImageRequest) {
            // MULTI-BILD-BACKUP (Falls Pollinations 502 hat)
            const seed = Math.floor(Math.random() * 999999);
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1024&seed=${seed}&nologo=true`;
            
            aiBubble.innerHTML = `Hier ist dein Bild:<br><img src="${imgUrl}" onload="this.parentElement.classList.remove('loading')" onerror="this.src='https://picsum.photos/500'">`;
            aiBubble.classList.remove('loading');
        } else {
            // MULTI-TEXT-BACKUP (Wechselt zwischen Modellen)
            try {
                // Erster Versuch: Pollinations OpenAI Modell
                let res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai`);
                
                if (!res.ok) {
                    // Zweiter Versuch: DuckDuckGo AI Bridge oder ähnliche freie Endpoints (Simuliert)
                    aiBubble.innerText = "Backup-Modus: Pollinations ist gerade überlastet (502). Versuche es in 10 Sekunden nochmal oder nutze ein Bild-Prompt!";
                } else {
                    const data = await res.text();
                    aiBubble.innerText = data;
                }
            } catch (e) {
                aiBubble.innerText = "Netzwerk-Fehler. Alle Systeme sind gerade down. Check mal dein Vercel-Deployment.";
            }
            aiBubble.classList.remove('loading');
        }
        chat.scrollTo(0, chat.scrollHeight);
    }

    function addBubble(t, c) {
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTo(0, chat.scrollHeight);
        return d;
    }

    function quick(q) { input.value = q; handleRequest(q); }
    btn.onclick = () => handleRequest(input.value);
    input.onkeypress = (e) => { if(e.key === 'Enter') handleRequest(input.value); };
</script>
</body>
</html>
